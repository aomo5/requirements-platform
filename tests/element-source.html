<!doctype html><meta charset="utf-8"><title>元素源码编辑测试</title><h1>元素源码编辑测试</h1><ol id="results"></ol><script type="module">
import { prepareElementSource } from '/assets/element-source.js';
import { createEditHistory } from '/assets/design-model.js';
const results = document.querySelector('#results');
function check(name,run){const li=document.createElement('li');try{run();li.textContent=`PASS · ${name}`;}catch(e){li.textContent=`FAIL · ${name} · ${e.message}`;}results.append(li);}
function assert(ok,message='断言未通过'){if(!ok)throw new Error(message);}
const raw='<!DOCTYPE html><html><head><style>.card{display:grid;gap:12px}.action{color:blue}</style></head><body><article class="card" id="card" data-key="account-a"><h2 id="title">账户余额</h2><button id="button" class="action"><svg viewBox="0 0 20 20"><path d="M1 1h5"/></svg>充值 &amp; 扣费<span id="badge">3</span></button><p>子内容</p></article></body></html>';
const model=prepareElementSource(raw), initial=model.serialize(), id=name=>model.records().find(r=>model.get(r.id).id===name)?.id;
const topology=html=>{const d=new DOMParser().parseFromString(html,'text/html');return [...d.querySelectorAll('*')].map(n=>[n.tagName,n.getAttribute('data-wb-element'),n.parentElement?.getAttribute('data-wb-element'),[...n.attributes].filter(a=>a.name!=='style').map(a=>[a.name,a.value])]);};
check('修改按钮自有文字不删除图标、徽标和固定编号',()=>{const button=id('button'), slot=model.describe(button).texts[0];model.text(button,slot.index,slot.text,'充值 <余额> & "明细"');assert(JSON.stringify(topology(initial))===JSON.stringify(topology(model.serialize())));assert(model.get(button).querySelector('svg path'));assert(model.get(button).querySelector('#badge').textContent==='3');assert(!model.serialize().includes('<余额>'));});
check('卡片样式保留 grid 和子元素，只增加局部样式',()=>{const card=id('card');model.style(card,'padding-left','24px');model.style(card,'background-color','#eaf2ff');assert(model.get(card).style.paddingLeft==='24px');assert(model.serialize().includes('display:grid;gap:12px'));assert(JSON.stringify(topology(initial))===JSON.stringify(topology(model.serialize())));});
check('清除样式、无效样式和过期文字的处理',()=>{const card=id('card');model.style(card,'padding-left','');assert(!model.get(card).style.paddingLeft);model.get(card).style.setProperty('color','red');assert(model.style(card,'color','red'));assert(model.get(card).style.getPropertyPriority('color')==='important');let rejects=0;for(const args of [[card,'width','url(https://example.com)'],[card,'position','absolute'],[card,'color','red;display:none']])try{model.style(...args);}catch{rejects++;}try{model.text(id('title'),0,'已过期','误写');}catch{rejects++;}assert(rejects===4);});
check('100 张状态页中只改当前页，撤销和重做保留其他页与锚点',()=>{const pages=Array.from({length:100},(_,i)=>({id:`p${i}`,name:`页面 ${i}`,html:initial,source:'shared.html',route:'#same'})), history=createEditHistory(pages);pages[0]={...pages[0],html:model.serialize()};history.record(pages);assert(pages.slice(1).every(p=>p.html===initial));assert(history.undo().every(p=>p.html===initial));const redo=history.redo();assert(redo[0].html===model.serialize());assert(redo[99].html===initial);assert(JSON.stringify(topology(redo[0].html))===JSON.stringify(topology(initial)));});
check('脚本原文、模板和用户文字不被执行或展开',()=>{const html=raw.replace('</body>','<template><p>模板文字</p></template><script>window.__ELEMENT_MODEL_TEST_EXECUTED__=true;/* <div>原文</div> */<\/script></body>');const s=prepareElementSource(html);s.style(s.records().find(r=>s.get(r.id).id==='card').id,'border-radius','12px');assert(!window.__ELEMENT_MODEL_TEST_EXECUTED__);assert(s.serialize().includes('/* <div>原文</div> */'));assert(s.serialize().includes('<p>模板文字</p>'));});
document.body.dataset.result=results.textContent.includes('FAIL')?'fail':'pass';
</script>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>合并重复页面 · 需求平台</title><style>body{font:14px/1.7 system-ui;background:#f5f6f8;color:#303133;max-width:760px;margin:60px auto}main{padding:28px;background:white;border:1px solid #e5e7eb;border-radius:8px}label{display:block;margin:20px 0 6px}select{width:100%;padding:10px;border:1px solid #dcdfe6;border-radius:4px}button{padding:10px 18px;margin-top:24px;background:#409eff;color:white;border:0;border-radius:4px}button:disabled{opacity:.5}#result{white-space:pre-wrap}a{color:#409eff}</style><main><h1>合并重复页面</h1><p id="feature"></p><p>目标页补齐原字段和记录后，迁移需求依据、流程绑定和页面入口，再移除旧画板。历史版本保留。</p><label for="source">移除的旧页面</label><select id="source" aria-label="移除的旧页面"></select><label for="target">保留的目标页面</label><select id="target" aria-label="保留的目标页面"></select><button id="submit" disabled>合并并删除旧页</button><p id="result" role="status">正在读取页面…</p><a id="open" hidden>打开合并后的页面</a></main><script type="module">
const path=new URLSearchParams(location.search).get('path'),q='?path='+encodeURIComponent(path);let data;
async function load(){const r=await fetch('/api/design'+q),d=await r.json();if(!r.ok)throw Error(d.error);data=d;document.querySelector('#feature').textContent=d.entry.feature+' · '+d.workspace.pages.length+' 张画板';for(const id of ['source','target']){const el=document.getElementById(id),prior=el.value;el.replaceChildren(...d.workspace.pages.map(p=>new Option(p.name,p.id)));if(d.workspace.pages.some(p=>p.id===prior))el.value=prior;}document.querySelector('#submit').disabled=!d.canEdit;}
try{await load();document.querySelector('#result').textContent='请选择旧页与目标页。';}catch(e){document.querySelector('#result').textContent=e.message;}
document.querySelector('#submit').onclick=async()=>{const b=document.querySelector('#submit');b.disabled=true;try{const r=await fetch('/api/design/merge'+q,{method:'POST',headers:{'Content-Type':'application/json','X-Design-Client':'workbench-v1'},body:JSON.stringify({expectedRevision:data.workspace.revision,sourceId:document.querySelector('#source').value,targetId:document.querySelector('#target').value})}),d=await r.json();if(!r.ok)throw Error(d.error);await load();document.querySelector('#result').textContent='合并完成；当前 '+d.workspace.pages.length+' 张画板。迁移需求关联 '+d.migrated.notes+' 条、流程绑定 '+d.migrated.nodes+' 个、页面入口 '+d.migrated.pageLinks+' 处、文档 '+d.migrated.documents+' 份。';const link=document.querySelector('#open');link.hidden=false;link.href='/#'+new URLSearchParams({path,view:'preview',prototype:'design:'+document.querySelector('#target').value});}catch(e){document.querySelector('#result').textContent=e.message;}finally{b.disabled=false;}};
</script></html>

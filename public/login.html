<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 需求平台</title><link rel="stylesheet" href="/assets/workbench-tokens.css"><link rel="stylesheet" href="/assets/workbench-base.css"><link rel="stylesheet" href="/assets/accounts.css"></head><body class="account-page"><main class="account-card"><h1>需求平台</h1><form id="accountForm"><label>账号<input name="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,63}" placeholder="字母、数字、点、横线或下划线"></label><label id="displayNameField" hidden>姓名<input name="displayName" autocomplete="name" maxlength="80"></label><label>密码<input name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"></label><p id="accountError" role="alert"></p><button id="accountSubmit" type="submit">登录</button><button id="accountToggle" type="button" class="account-secondary">注册账号</button></form></main><script type="module" src="/assets/accounts.js"></script></body></html>

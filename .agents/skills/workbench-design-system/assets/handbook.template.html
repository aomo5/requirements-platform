<script>
const system=JSON.parse(document.getElementById('systemData').textContent);
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon={chevron:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>',plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>',copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>'};
let toastTimer;
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2200)}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('downloadTokens').onclick=()=>{const tokens=Object.fromEntries(Object.entries(system.tokens).map(([k,{resolved,...v}])=>[k,v]));download('workbench-tokens.json',JSON.stringify({name:'工作台设计系统',version:system.version,profile:'light-zh-workbench',tokens},null,2),'application/json')};
$('downloadCSS').onclick=()=>download('workbench-tokens.css',':root{\n'+Object.entries(system.tokens).map(([k,v])=>`  --wb-${k}: ${v.resolved};`).join('\n')+'\n}','text/css');
const sample=(label,body)=>`<div class="sample"><div class="sample-label"><span>${label}</span><span>交互示例</span></div>${body}</div>`;
function example(id,markup){document.querySelector(`[data-example="${id}"]`).innerHTML=markup}
example('overview',`<div class="mini-workbench"><div class="mini-head"><span>需求工作台 / 页面设计</span><small>已自动保存</small></div><div class="mini-body"><div class="mini-nav"><div>页面</div><div class="selected">提交评审</div><div>评审结果</div></div><div class="mini-canvas"><div class="mini-page"><strong>提交评审</strong><div></div><div></div><div></div><button class="btn primary" id="overviewLink" style="margin-top:24px">查看关联模式</button></div></div><div class="mini-props"><p>页面属性</p><p><span>名称</span><br>提交评审</p><p><span>页面状态</span><br>默认状态</p><p><span>关联需求</span><br>1 条</p></div></div></div><p class="sample-caption">内容居中，导航与属性围绕当前对象展开。</p>`);
$('overviewLink').onclick=()=>location.hash='links';
const swatchKeys=['text-primary','text-secondary','text-tertiary','bg-surface','bg-subtle','bg-canvas','accent','action-primary','accent-subtle','danger','success','warning'];
const palette=Object.entries(system.tokens).filter(([k])=>k.startsWith('neutral-'));
example('color',`<div class="swatch-row">${palette.map(([k,t],i)=>`<div style="background:${t.resolved};color:${i>5?'#fff':'#383838'}"><span>${k.split('-')[1]}</span></div>`).join('')}</div><div class="token-grid">${swatchKeys.map(k=>{const t=system.tokens[k],text=k.startsWith('text-');return `<div class="token"><div class="token-swatch" style="${text?`color:${t.resolved};background:white`:`background:${t.resolved}`}" aria-hidden="true">${text?'需求与页面 · Aa':''}</div><div class="token-body"><span>${t.use}</span><small>--wb-${k}</small><button class="token-copy" data-copy="var(--wb-${k})" aria-label="复制 ${k} 变量">${t.resolved}${icon.copy}</button></div></div>`}).join('')}</div>`);
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);notify('已复制 '+b.dataset.copy)}catch{notify('复制不可用：'+b.dataset.copy)}});
example('typography',sample('文字层级',`<div class="type-row"><span style="font-size:var(--wb-font-title);line-height:var(--wb-line-title);font-weight:var(--wb-weight-title)">为内容留出空间</span><small>28 / 36 · 600</small></div><div class="type-row"><span style="font-size:var(--wb-font-heading);line-height:var(--wb-line-heading);font-weight:var(--wb-weight-medium)">明确当前处理的对象</span><small>18 / 28 · 500</small></div><div class="type-row"><span>需求、页面和状态自然衔接，修改后自动保存。</span><small>14 / 24 · 400</small></div><div class="type-row"><span style="font-size:13px;font-weight:500">页面属性</span><small>13 / 20 · 500</small></div><div class="type-row"><span style="font-size:12px;color:var(--wb-text-secondary)">页面名称</span><small>12 / 20 · 400</small></div><div class="type-row"><span style="font-size:11px;color:var(--wb-text-tertiary)">已自动保存 · 3 个状态</span><small>11 / 16 · 400</small></div>`));

example('icons',sample('图标盒与点击区域',`<div class="example-row">${[[32,'常规工具'],[36,'画布工具'],[44,'触控主要操作']].map(([size,label])=>`<div class="state-cell"><span style="display:flex;align-items:center;justify-content:center;width:80px;height:80px"><span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border:1px dashed var(--wb-border-control);border-radius:var(--wb-radius-control);background:var(--wb-bg-subtle)">${icon.copy}</span></span><span>${label}</span><small>${size} × ${size}px · 图标 16px</small></div>`).join('')}</div>`));
example('button',sample('主操作 · 状态矩阵',`<div class="example-row">${[['default','默认'],['hover','悬停'],['pressed','按下'],['focus','焦点'],['disabled','禁用']].map(([s,l])=>`<div class="state-cell"><button class="btn primary" data-state="${s}" ${s==='disabled'?'disabled':''} data-demo-action>创建页面</button><small>${l}</small></div>`).join('')}</div>`)+sample('操作层级',`<div class="example-row"><button class="btn primary" id="exportExample">导出页面</button><button class="btn" data-demo-action>复制</button><button class="btn ghost" data-demo-action>更多操作</button><button class="btn ghost danger" data-demo-action>删除</button><button class="btn icon-button" data-demo-action aria-label="新建页面">${icon.plus}</button></div><p class="sample-caption" id="buttonResult" role="status">点击按钮查看反馈，Tab 可检查键盘焦点。</p>`));
document.querySelectorAll('[data-demo-action]').forEach(b=>b.onclick=()=>{$('buttonResult').textContent='已触发示例动作：'+(b.textContent.trim()||b.getAttribute('aria-label'))});
$('exportExample').onclick=()=>{const b=$('exportExample');b.disabled=true;b.setAttribute('aria-busy','true');b.textContent='正在导出';setTimeout(()=>{b.disabled=false;b.removeAttribute('aria-busy');b.textContent='导出页面';$('buttonResult').textContent='示例处理完成';},700)};
example('input',sample('字段状态',`<div class="field-grid"><label class="field">页面名称<input value="提交评审"></label><label class="field">页面名称<span><input value="" placeholder="请输入页面名称" aria-invalid="true" aria-describedby="inputError"></span><small class="error-text" id="inputError">名称不能为空</small></label><label class="field">只读来源<input value="需求文档 / 评审规则" readonly></label><label class="field">不可用字段<input value="无编辑权限" disabled></label></div>`));
example('navigation',sample('导航与同页状态',`<div role="tablist" class="demo-tabs" aria-label="示例工作区"><button class="demo-tab" role="tab" aria-selected="false" aria-controls="demoTabPanel" id="demoRequirementsTab" tabindex="-1">需求</button><button class="demo-tab" role="tab" aria-selected="false" aria-controls="demoTabPanel" id="demoFlowTab" tabindex="-1">流程</button><button class="demo-tab" role="tab" aria-selected="true" aria-controls="demoTabPanel" id="demoDesignTab">设计</button></div><div id="demoTabPanel" role="tabpanel" aria-labelledby="demoDesignTab"><button class="disclosure" aria-expanded="false" aria-controls="demoStateStack" id="disclosure">${icon.chevron}<span>提交评审</span><small>3</small></button><div class="state-stack" id="demoStateStack" hidden><button aria-pressed="true">默认状态</button><button aria-pressed="false">提交失败</button><button aria-pressed="false">已提交</button></div><p class="sample-caption" id="tabDescription">选择页面，展开查看状态。</p></div>`));
const demoTabs=[...document.querySelectorAll('.demo-tab')];function pickDemoTab(b){demoTabs.forEach(x=>{x.setAttribute('aria-selected',String(x===b));x.tabIndex=x===b?0:-1});$('demoTabPanel').setAttribute('aria-labelledby',b.id);const design=b.textContent==='设计';$('disclosure').hidden=!design;$('demoStateStack').hidden=!design||$('disclosure').getAttribute('aria-expanded')!=='true';$('tabDescription').textContent=design?'选择页面，展开查看状态。':b.textContent==='需求'?'提交后应显示评审结果，可继续定位关联页面。':'开始 → 提交评审 → 查看结果'}demoTabs.forEach((b,i)=>{b.onclick=()=>pickDemoTab(b);b.onkeydown=e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?demoTabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+demoTabs.length)%demoTabs.length;pickDemoTab(demoTabs[next]);demoTabs[next].focus()}});
$('disclosure').onclick=()=>{const expanded=$('disclosure').getAttribute('aria-expanded')!=='true';$('disclosure').setAttribute('aria-expanded',expanded);$('demoStateStack').hidden=!expanded};document.querySelectorAll('#demoStateStack button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#demoStateStack button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('tabDescription').textContent='当前状态：'+b.textContent});
example('panel',sample('浮层与焦点',`<button class="btn" id="openDialog">打开版本说明</button><p class="sample-caption">打开后可用 Esc 关闭，焦点回到此入口。</p>`));$('openDialog').onclick=()=>$('exampleDialog').showModal();$('closeDialog').onclick=()=>$('exampleDialog').close();$('exampleDialog').addEventListener('close',()=>$('openDialog').focus());
example('feedback',sample('保存与异常恢复',`<div class="notice" id="saveFeedback" role="status">已自动保存</div><div class="example-row" style="margin-top:16px"><button class="btn" id="simulateFailure">模拟保存失败</button><button class="btn" id="retrySave" hidden>重试保存</button></div>`));$('simulateFailure').onclick=()=>{$('saveFeedback').className='notice error';$('saveFeedback').textContent='保存失败，修改已保留。';$('retrySave').hidden=false};$('retrySave').onclick=()=>{$('retrySave').disabled=true;$('saveFeedback').className='notice';$('saveFeedback').textContent='正在保存…';setTimeout(()=>{$('retrySave').disabled=false;$('retrySave').hidden=true;$('saveFeedback').className='notice success';$('saveFeedback').textContent='已自动保存';},600)};
example('canvas',`<div class="diagram"><div>当前需求</div><span>→</span><div>页面 / 流程画布</div><span>→</span><div>选中对象属性</div></div><p class="sample-caption">导航保留任务范围，画布保留全局关系，属性只展示当前对象可执行的操作。</p>`);
example('links',`<div class="sample-label"><span>需求与元素的完整往返</span><span>本地演示</span></div><div class="journey" aria-hidden="true"><span id="journeySource" class="current">需求</span>→<span id="journeyElement">页面元素</span>→<span>备注 / 状态</span>→<span>原文</span></div><section class="source-card" id="linkSource"><h3>提交评审</h3><p id="demoRule" tabindex="-1">提交成功后，在当前页面显示评审结果；提交失败时保留已填写内容。</p><button class="btn" id="locateElement">定位关联元素</button></section><section id="linkEditor" hidden><div class="sample-label"><span>提交评审</span><label>页面状态 <select class="demo-state" id="linkState"><option value="default">默认状态</option><option value="error">提交失败</option><option value="success">已提交</option></select></label></div><div class="link-layout"><div class="link-stage"><div class="prototype"><h3 id="prototypeTitle">提交评审</h3><p id="prototypeDescription">确认页面与评审人后提交。</p><label class="field">页面名称<input id="prototypeName" value="计量组详情"></label><button class="btn primary element-highlight" id="linkedElement">提交评审</button></div></div><aside class="link-panel"><strong>元素关联</strong><blockquote>提交成功后，在当前页面显示评审结果；提交失败时保留已填写内容。</blockquote><label class="field">补充说明<textarea id="noteExample" placeholder="交互规则或例外情况"></textarea></label><div class="save-status" id="noteStatus" role="status">更改自动保存到本机示例</div><button class="btn ghost" id="backToRule">查看需求原文</button></aside></div></section>`);
let noteTimer,composing=false;const noteKey='workbench-design-system-demo-v1';try{$('noteExample').value=localStorage.getItem(noteKey)||''}catch{}function saveNote(){if(composing)return false;clearTimeout(noteTimer);try{localStorage.setItem(noteKey,$('noteExample').value);$('noteStatus').textContent='已保存到本机示例';return true}catch{$('noteStatus').textContent='本机存储不可用，当前输入仍保留';return false}}
$('noteExample').addEventListener('compositionstart',()=>composing=true);$('noteExample').addEventListener('compositionend',()=>{composing=false;saveNote()});$('noteExample').addEventListener('input',()=>{$('noteStatus').textContent='等待保存…';clearTimeout(noteTimer);noteTimer=setTimeout(saveNote,400)});
function renderLinkState(){const state=$('linkState').value;$('prototypeTitle').textContent=state==='success'?'评审已提交':state==='error'?'提交失败':'提交评审';$('prototypeDescription').textContent=state==='success'?'本次评审已记录，可继续查看页面。':state==='error'?'提交失败，填写内容已保留，请重试。':'确认页面与评审人后提交。';$('prototypeDescription').style.color=state==='error'?'var(--wb-danger)':'var(--wb-text-secondary)';$('linkedElement').textContent=state==='success'?'查看评审结果':state==='error'?'重新提交':'提交评审'}
$('locateElement').onclick=()=>{$('linkSource').hidden=true;$('linkEditor').hidden=false;$('journeySource').classList.remove('current');$('journeyElement').classList.add('current');$('linkedElement').focus()};$('backToRule').onclick=()=>{if(!saveNote())return;$('linkEditor').hidden=true;$('linkSource').hidden=false;$('linkSource').classList.add('focused');$('journeySource').classList.add('current');$('journeyElement').classList.remove('current');$('demoRule').focus()};$('linkState').onchange=()=>{saveNote();renderLinkState()};$('linkedElement').onclick=()=>notify('当前元素已定位，需求依据与备注位于右侧');
example('creation',sample('点击即创建 · 原位命名',`<div class="example-row"><button class="btn" id="createPage">${icon.plus}新建页面</button><button class="btn ghost" id="undoCreate" disabled>撤销新建</button><span id="createStatus" role="status" class="sample-caption" style="margin:0"></span></div><div class="creation-list" id="createdPages"></div>`));
let created=0;$('createPage').onclick=()=>{created++;const row=document.createElement('div');row.className='creation-row';const name='未命名页面 '+created;row.innerHTML=`<input aria-label="页面 ${created} 的名称" value="${name}"><small>已创建</small>`;$('createdPages').append(row);const input=row.querySelector('input');let saved=name;const commit=()=>{input.value=input.value.trim()||saved;saved=input.value;row.querySelector('small').textContent='名称已更新';$('createStatus').textContent='已保存 '+saved};input.onchange=commit;input.onkeydown=e=>{if(e.isComposing)return;if(e.key==='Enter'){commit();input.blur()}if(e.key==='Escape'){input.value=saved;input.blur()}};input.focus();input.select();$('undoCreate').disabled=false;$('createStatus').textContent='已创建 '+name};$('undoCreate').onclick=()=>{$('createdPages').lastElementChild?.remove();$('undoCreate').disabled=!$('createdPages').children.length;$('createStatus').textContent='已撤销最近的新建';$('createPage').focus()};
example('states',`<div class="state-gallery"><div class="state-card"><h3>默认状态</h3><p>页面已准备好，可以开始提交评审。</p><span class="btn primary">提交评审</span></div><div class="state-card"><h3>提交失败</h3><div class="notice error">填写内容已保留</div><p style="margin-top:12px">网络异常后可以重试。</p><span class="btn">重新提交</span></div><div class="state-card"><h3>已提交</h3><div class="notice success">评审已提交</div><p style="margin-top:12px">结果和后续动作独立呈现。</p><span class="btn">查看结果</span></div></div><p class="sample-caption">静态状态标本。完整可操作样例位于“需求与元素关联”。</p>`);
example('writing',sample('用操作表达关系',`<div class="diagram"><div>清楚的名称</div><span>＋</span><div>当前选择</div><span>＋</span><div>连续的上下文</div></div>`));
example('accessibility',sample('键盘焦点与文字对比',`<div class="example-row"><button class="btn" data-state="focus" id="focusExample">Tab 检查焦点</button><span style="color:var(--wb-text-secondary);font-size:12px">次级文字仍然可读</span><button class="btn" disabled>不可编辑</button></div><p class="sample-caption" id="focusResult" role="status">Enter 或 Space 可执行此示例按钮。</p>`));$('focusExample').onclick=()=>$('focusResult').textContent='键盘或点击操作已响应';
example('review',sample('本次受影响范围',`<div class="check-list">${['语义 token 与实际文字层级一致','默认、悬停、按下、焦点和禁用已检查','需求到元素再回原文保留上下文','保存失败和空白草稿有自然处理','窄屏入口与主要操作仍可达','删除无新增判断信息的说明'].map((s,i)=>`<label><input type="checkbox" name="review-${i}">${s}</label>`).join('')}</div><p class="sample-caption" id="checkStatus" role="status">0 / 6 已检查 · 仅本次手册演示</p>`));document.querySelectorAll('.check-list input').forEach(i=>i.onchange=()=>$('checkStatus').textContent=document.querySelectorAll('.check-list input:checked').length+' / 6 已检查 · 仅本次手册演示');
let current='';const links=[...document.querySelectorAll('[data-nav]')];
function showSection(focus=false){const hash=location.hash.slice(1),id=system.sections.find(s=>s.id===hash||hash.startsWith(s.id+'-'))?.id||'overview';if(current===id&&hash!==id){$(hash)?.scrollIntoView({block:'start',behavior:'instant'});return;}current=id;document.querySelectorAll('.doc').forEach(el=>el.hidden=el.id!==id);links.forEach(a=>a.getAttribute('data-nav')===id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));const currentDoc=$(id);$('tocItems').innerHTML=[...currentDoc.querySelectorAll('h2')].map(h=>`<a href="#${h.id}">${esc(h.textContent)}</a>`).join('');$('tocItems').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();$(a.hash.slice(1)).scrollIntoView({block:'start',behavior:'instant'})});const i=system.sections.findIndex(s=>s.id===id);$('prev').hidden=i===0;$('next').hidden=i===system.sections.length-1;if(i>0){$('prev').href='#'+system.sections[i-1].id;$('prev').textContent='← '+system.sections[i-1].title}if(i<system.sections.length-1){$('next').href='#'+system.sections[i+1].id;$('next').textContent=system.sections[i+1].title+' →'}document.title=system.sections[i].title+' · 工作台设计系统';window.scrollTo(0,0);if(hash!==id&&$(hash))$(hash).scrollIntoView({block:'start',behavior:'instant'});else if(focus)currentDoc.querySelector('h1').focus({preventScroll:true});setMenu(false)}
function setMenu(open){document.querySelector('.sidebar').inert=innerWidth<=760&&!open;document.body.classList.toggle('menu-open',open);$('menuToggle').setAttribute('aria-expanded',open);$('menuToggle').setAttribute('aria-label',open?'关闭规范目录':'打开规范目录')}
$('menuToggle').onclick=()=>setMenu(!document.body.classList.contains('menu-open'));$('scrim').onclick=()=>{setMenu(false);$('menuToggle').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open')){setMenu(false);$('menuToggle').focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(innerWidth<=760)setMenu(true);$('search').focus()}});
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();let count=0;links.forEach(a=>{const id=a.dataset.nav,match=!q||(id+' '+$(id).textContent).toLowerCase().includes(q);a.hidden=!match;if(match)count++});document.querySelectorAll('.nav-group').forEach(g=>{let el=g.nextElementSibling,visible=false;while(el&&el.matches('a')){visible=visible||!el.hidden;el=el.nextElementSibling}g.hidden=!visible});$('searchEmpty').hidden=count>0;$('searchStatus').textContent=q?count+' 个匹配章节':''});
window.addEventListener('resize',()=>setMenu(document.body.classList.contains('menu-open')));document.querySelector('.skip').onclick=e=>{e.preventDefault();$('main').focus()};window.addEventListener('hashchange',()=>showSection(true));window.addEventListener('pagehide',()=>{if(noteTimer)saveNote()});showSection();
</script>

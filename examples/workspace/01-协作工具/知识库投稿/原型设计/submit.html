<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库投稿</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; color: #16272b; background: #f1f5f4; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 560px; margin: 32px auto; padding: clamp(20px, 6vw, 40px); border: 1px solid #d5e0de; border-radius: 14px; background: #fff; }
  h1 { margin: 0 0 24px; font-size: 28px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input, textarea { width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #899a98; border-radius: 6px; font: inherit; }
  button { margin-top: 20px; padding: 10px 16px; border: 0; border-radius: 6px; color: white; background: #165951; font: inherit; cursor: pointer; }
  #result { color: #165951; }
</style>
<main>
  <h1>知识库投稿</h1>
  <form>
    <label for="article-title">标题</label>
    <input id="article-title" name="title" required maxlength="80">
    <label for="article-summary">摘要</label>
    <textarea id="article-summary" name="summary" required maxlength="300" rows="4"></textarea>
    <button>提交审核</button>
  </form>
  <p id="result" role="status"></p>
</main>
<script>
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    document.getElementById('result').textContent = '已提交审核';
  });
</script>
</html>
